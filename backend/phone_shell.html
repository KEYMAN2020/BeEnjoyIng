<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>银发活力 | BeEnjoyIng</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,sans-serif;padding:20px}
    .w{position:relative;width:390px;height:844px;flex-shrink:0}
    .g{position:absolute;inset:-12px;background:#1a1a1a;border-radius:48px;box-shadow:0 0 0 3px #333,0 20px 60px rgba(0,0,0,.6)}
    .s{position:absolute;inset:0;border-radius:36px;overflow:hidden;background:#F5F2EE}
    .s iframe{width:100%;height:100%;border:none}
    .b{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:rgba(0,0,0,.2);border-radius:100px;z-index:10}
    @media(max-width:440px){
      .w{width:100vw;height:100vh}
      .g{border-radius:0;inset:0;box-shadow:none}
      .s{border-radius:0}
      .b{display:none}
      body{padding:0}
    }
  </style>
</head>
<body>
  <div class="w">
    <div class="g"></div>
    <div class="s"><iframe src="/app/"></iframe></div>
    <div class="b"></div>
  </div>
</body>
</html>
